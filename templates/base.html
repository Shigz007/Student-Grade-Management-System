<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>学生成绩管理系统</title>
    <link href="https://fonts.googleapis.com/css?family=Nunito:400,600,700,800|Roboto:400,500,700" rel="stylesheet">
    <link type="text/css" href="/assets/css/theme.css" rel="stylesheet">
    <link type="text/css" href="/assets/css/demo.css" rel="stylesheet">
    <style>
        .sidebar { position: fixed; top: 0; left: 0; bottom: 0; width: 250px; background: #1e1e2d; z-index: 100; padding-top: 20px; }
        .sidebar .sidebar-brand { padding: 15px 20px; margin-bottom: 20px; }
        .sidebar .sidebar-brand a { color: #fff; font-size: 1.2rem; text-decoration: none; }
        .sidebar .navigation { list-style: none; padding: 0; }
        .sidebar .navigation-item { padding: 0; }
        .sidebar .navigation-link { display: block; padding: 10px 20px; color: #a2a3b7; text-decoration: none; transition: all 0.2s; }
        .sidebar .navigation-link:hover, .sidebar .navigation-link.active { color: #fff; background: rgba(255,255,255,0.05); }
        .sidebar .navigation-link i { width: 20px; margin-right: 10px; text-align: center; }
        .main-content { margin-left: 250px; min-height: 100vh; background: #f5f5f9; }
        .topbar { background: #fff; padding: 15px 25px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e8e8ef; }
        .topbar .user-info { display: flex; align-items: center; gap: 15px; }
        .page-content { padding: 25px; }
        .stat-card { border-radius: 8px; border: none; transition: transform 0.2s; }
        .stat-card:hover { transform: translateY(-2px); }
        .stat-card .stat-icon { font-size: 2rem; opacity: 0.7; }
        .stat-card .stat-value { font-size: 1.8rem; font-weight: 700; }
        .card-table { border-radius: 8px; border: none; }
        .btn-action { padding: 4px 10px; font-size: 0.8rem; }
        @media (max-width: 768px) {
            .sidebar { display: none; }
            .main-content { margin-left: 0; }
        }
    </style>
</head>
<body>
    <aside class="sidebar">
        <div class="sidebar-brand">
            <a href="/"><strong>成绩管理</strong>系统</a>
        </div>
        <ul class="navigation">
            <li class="navigation-item">
                <a class="navigation-link" href="/" id="nav-dashboard"><i class="fas fa-tachometer-alt"></i> 仪表盘</a>
            </li>
            <li class="navigation-item" id="nav-students-item">
                <a class="navigation-link" href="/students" id="nav-students"><i class="fas fa-user-graduate"></i> 学生管理</a>
            </li>
            <li class="navigation-item" id="nav-grades-item">
                <a class="navigation-link" href="/grades" id="nav-grades"><i class="fas fa-clipboard-list"></i> 成绩管理</a>
            </li>
        </ul>
    </aside>

    <div class="main-content">
        <div class="topbar">
            <h5 class="mb-0" id="page-title">仪表盘</h5>
            <div class="user-info">
                <span id="user-display"></span>
                <button class="btn btn-sm btn-outline-danger" onclick="logout()">退出</button>
            </div>
        </div>
        <div class="page-content">
            {% block content %}{% endblock %}
        </div>
    </div>

    <script src="/assets/vendor/jquery/jquery.min.js"></script>
    <script src="/assets/vendor/popper/popper.min.js"></script>
    <script src="/assets/js/bootstrap/bootstrap.min.js"></script>
    <script src="/assets/vendor/fontawesome/js/fontawesome-all.min.js" defer></script>
    <script src="/assets/js/theme.js"></script>
    <script src="/static/js/api.js"></script>
    <script src="/static/js/main.js"></script>
</body>
</html>
