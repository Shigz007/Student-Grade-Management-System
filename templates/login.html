<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>登录 - 学生成绩管理系统</title>
    <link href="https://fonts.googleapis.com/css?family=Nunito:400,600,700,800|Roboto:400,500,700" rel="stylesheet">
    <link type="text/css" href="/assets/css/theme.css" rel="stylesheet">
    <link type="text/css" href="/assets/css/demo.css" rel="stylesheet">
    <style>
        body { background: #f5f5f9; }
        .login-card { max-width: 420px; margin: 80px auto; border-radius: 10px; border: none; }
        .login-card .card-body { padding: 40px; }
        .login-header { text-align: center; margin-bottom: 30px; }
        .login-header .icon { font-size: 3rem; color: #5e72e4; margin-bottom: 15px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="login-card card shadow-lg">
            <div class="card-body">
                <div class="login-header">
                    <div class="icon"><i class="fas fa-school"></i></div>
                    <h4 class="heading h3 mb-2">学生成绩管理系统</h4>
                    <p class="text-muted">请登录您的账号</p>
                </div>
                <div class="alert alert-danger" id="login-error" style="display:none;"></div>
                <form id="login-form">
                    <div class="form-group">
                        <label>用户名</label>
                        <input type="text" class="form-control" id="username" placeholder="请输入用户名" required>
                    </div>
                    <div class="form-group">
                        <label>密码</label>
                        <input type="password" class="form-control" id="password" placeholder="请输入密码" required>
                    </div>
                    <button type="submit" class="btn btn-primary btn-block btn-lg mt-4">登 录</button>
                </form>
            </div>
        </div>
    </div>

    <script src="/assets/vendor/jquery/jquery.min.js"></script>
    <script src="/assets/vendor/popper/popper.min.js"></script>
    <script src="/assets/js/bootstrap/bootstrap.min.js"></script>
    <script src="/assets/vendor/fontawesome/js/fontawesome-all.min.js" defer></script>
    <script src="/assets/js/theme.js"></script>
    <script src="/static/js/api.js"></script>
    <script>
        $(function() {
            if (localStorage.getItem('token')) {
                window.location.href = '/';
            }
            $('#login-form').on('submit', function(e) {
                e.preventDefault();
                var username = $('#username').val().trim();
                var password = $('#password').val();
                $.ajax({
                    url: '/api/login',
                    method: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify({ username: username, password: password }),
                    success: function(res) {
                        localStorage.setItem('token', res.token);
                        localStorage.setItem('user', JSON.stringify(res.user));
                        window.location.href = '/';
                    },
                    error: function(xhr) {
                        var msg = xhr.responseJSON ? xhr.responseJSON.error : '登录失败';
                        $('#login-error').text(msg).show();
                    }
                });
            });
        });
    </script>
</body>
</html>
