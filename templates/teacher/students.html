{% extends "teacher/base.html" %}
{% block content %}
<div class="card z-depth-1 mb-4">
    <div class="card-header"><h6 class="heading h6 mb-0">学生筛选</h6></div>
    <div class="card-body">
        <div class="d-flex justify-content-between align-items-center flex-wrap">
            <div class="input-group input-group-transparent mr-2 mb-2" style="max-width: 280px;">
                <div class="input-group-prepend"><span class="input-group-text"><i class="fas fa-search"></i></span></div>
                <input type="text" class="form-control form-control-sm" id="search-input" placeholder="搜索学号/姓名...">
            </div>
            <button class="btn btn-sm btn-primary mb-2" id="btn-add-student"><i class="fas fa-plus mr-1"></i>新增学生</button>
        </div>
    </div>
</div>

<div class="card z-depth-1">
    <div class="card-header d-flex justify-content-between align-items-center">
        <h6 class="heading h6 mb-0">学生列表</h6>
        <div class="d-flex align-items-center">
            <small class="text-muted mr-2">每页</small>
            <select class="form-control form-control-sm" style="width:72px" id="student-page-size">
                <option value="10">10</option>
                <option value="30">30</option>
                <option value="50">50</option>
            </select>
            <small class="text-muted ml-2">条</small>
        </div>
    </div>
    <div class="card-body p-0">
        <div class="table-responsive">
        <table class="table table-hover mb-0">
            <thead><tr><th>学号</th><th>姓名</th><th>性别</th><th>班级</th><th>电话</th></tr></thead>
            <tbody id="student-table"></tbody>
        </table>
        </div>
        <div class="d-flex justify-content-between align-items-center flex-wrap px-3 py-2 border-top">
            <small class="text-muted mb-1" id="student-page-info"></small>
            <div class="d-flex align-items-center mx-2 mb-1">
                <small class="text-muted mr-1">跳至</small>
                <input type="text" class="form-control form-control-sm page-jump-input" id="student-jump-page">
                <small class="text-muted ml-1">页</small>
            </div>
            <nav><ul class="pagination pagination-sm mb-0 flex-wrap" id="student-pagination"></ul></nav>
        </div>
    </div>
</div>

<div class="modal fade" id="student-modal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header"><h5 class="modal-title" id="student-modal-title">新增学生</h5><button type="button" class="close" data-dismiss="modal">&times;</button></div>
            <div class="modal-body">
                <input type="hidden" id="edit-student-id">
                <div class="form-row">
                    <div class="form-group col-md-6"><label class="form-control-label">入学年份</label><input type="text" class="form-control" id="form-enrollment-year" readonly></div>
                    <div class="form-group col-md-6"><label class="form-control-label">学院 <span class="text-danger">*</span> <small class="text-danger field-error" id="err-college"></small></label><select class="form-control" id="form-college"><option value="">请选择</option></select></div>
                </div>
                <div class="form-row">
                    <div class="form-group col-md-6"><label class="form-control-label">专业 <span class="text-danger">*</span> <small class="text-danger field-error" id="err-major"></small></label><select class="form-control" id="form-major" disabled><option value="">请先选择学院</option></select></div>
                    <div class="form-group col-md-6"><label class="form-control-label">班级序号 <span class="text-danger">*</span></label><select class="form-control" id="form-class-seq" disabled><option value="">先选专业</option></select></div>
                </div>
                <div class="form-group"><label class="form-control-label">学号 <small class="text-muted">（自动生成）</small></label><input type="text" class="form-control" id="form-student-no" readonly required></div>
                <div class="form-group"><label class="form-control-label">姓名 <span class="text-danger">*</span> <small class="text-danger field-error" id="err-name"></small></label><input type="text" class="form-control" id="form-name" required></div>
                <div class="form-group"><label class="form-control-label">性别 <span class="text-danger">*</span> <small class="text-danger field-error" id="err-gender"></small></label><select class="form-control" id="form-gender"><option value="">请选择</option><option value="男">男</option><option value="女">女</option></select></div>
                <div class="form-group"><label class="form-control-label">电话 <span class="text-danger">*</span> <small class="text-danger field-error" id="err-phone"></small></label><input type="text" class="form-control" id="form-phone" required></div>
            </div>
            <div class="modal-footer"><button type="button" class="btn btn-secondary" data-dismiss="modal">取消</button><button type="button" class="btn btn-primary" id="btn-save-student">保存</button></div>
        </div>
    </div>
</div>

<script>
$(function() {
    checkAuth();
    initForm();
    loadStudents();

    $('#search-input').on('input', loadStudents);

    var myClasses = [];

    api.getMyClasses().then(function(classes) { myClasses = classes; });

    function resetClassSelect() {
        $('#form-class-seq').html('<option value="">先选专业</option>').prop('disabled', true);
        $('#form-student-no').val('');
    }

    $('#form-college').on('change', function() {
        var college = $(this).val(); var $major = $('#form-major'); $major.empty();
        resetClassSelect();
        if (!college) { $major.html('<option value="">请先选择学院</option>').prop('disabled', true); return; }
        api.getMajors({college_code: college}).then(function(majors) {
            $major.prop('disabled', false).append('<option value="">请选择专业</option>');
            majors.forEach(function(m) { $major.append('<option value="' + m.code + '">' + m.name + '</option>'); });
        });
    });

    $('#form-major').on('change', function() {
        var college = $('#form-college').val();
        var major = $(this).val();
        var $cls = $('#form-class-seq');
        $cls.html('<option value="">选择班级</option>');
        $('#form-student-no').val('');
        if (!college || !major) { $cls.prop('disabled', true); return; }
        var filtered = myClasses.filter(function(c) { return c.college_code === college && c.major_code === major; });
        if (filtered.length === 0) { $cls.html('<option value="">无可用班级</option>').prop('disabled', true); return; }
        $cls.prop('disabled', false);
        filtered.forEach(function(c) { $cls.append('<option value="' + c.class_name + '">' + c.class_name + '班</option>'); });
    });

    $('#form-class-seq').on('change', refreshStudentNo);

    $('#btn-add-student').click(function() {
        $('#edit-student-id').val(''); $('#student-modal-title').text('新增学生');
        $('#form-name,#form-gender,#form-phone').val(''); $('#form-college').val('');
        $('#form-enrollment-year').val(new Date().getFullYear());
        $('#form-major').html('<option value="">请先选择学院</option>').prop('disabled', true);
        resetClassSelect(); $('.field-error').text('');
        $('#student-modal').modal('show');
    });

    $('#btn-save-student').click(function() {
        var id = $('#edit-student-id').val();
        var data = {
            student_no: $('#form-student-no').val().trim(), name: $('#form-name').val().trim(),
            gender: $('#form-gender').val(), enrollment_year: $('#form-enrollment-year').val(),
            college_code: $('#form-college').val(), major_code: $('#form-major').val(),
            class_name: '', phone: $('#form-phone').val().trim(), email: ''
        };
        $('.field-error').text('');
        var ok = true;
        if (!data.student_no) { showToast('请选择班级以自动生成学号', 'warning'); ok = false; }
        if (!data.name) { $('#err-name').text('请输入姓名'); ok = false; }
        if (!data.gender) { $('#err-gender').text('请选择性别'); ok = false; }
        if (!data.college_code) { $('#err-college').text('请选择学院'); ok = false; }
        if (!data.major_code) { $('#err-major').text('请选择专业'); ok = false; }
        if (!data.phone) { $('#err-phone').text('请输入电话'); ok = false; }
        if (!ok) { showToast('还有必填项未填写', 'warning'); return; }
        if (id) { api.updateStudent(id, data).then(function() { $('#student-modal').modal('hide'); loadStudents(); showToast('修改成功', 'success'); }).fail(function(xhr) { var m = xhr.responseJSON && xhr.responseJSON.error ? xhr.responseJSON.error : '修改失败'; showToast(m, 'danger'); }); }
        else { api.addStudent(data).then(function(res) { $('#student-modal').modal('hide'); loadStudents(); showToast(res.message, 'success'); }).fail(function(xhr) { var m = xhr.responseJSON && xhr.responseJSON.error ? xhr.responseJSON.error : '添加失败'; showToast(m, 'danger'); }); }
    });

    function initForm() {
        $('#form-enrollment-year').val(new Date().getFullYear());
        api.getColleges().then(function(colleges) {
            var html = '<option value="">请选择学院</option>';
            colleges.forEach(function(c) { html += '<option value="' + c.code + '">' + c.name + '</option>'; });
            $('#form-college').html(html);
        });
    }

    function refreshStudentNo() {
        var year = $('#form-enrollment-year').val(), college = $('#form-college').val(), major = $('#form-major').val();
        var cls = $('#form-class-seq').val();
        if (!year || !college || !major || !cls) { $('#form-student-no').val(''); return; }
        api.getNextStudentNo({ year: year, college: college, major: major, 'class': cls }).then(function(res) {
            if (res.error) { showToast(res.error, 'danger'); return; }
            $('#form-student-no').val(res.student_no);
        });
    }

    var allStudentsData = []; var studentPage = 1; var studentPageSize = 10;

    function loadStudents() {
        var search = $('#search-input').val().trim();
        api.getStudents(search ? { search: search } : {}).then(function(students) {
            allStudentsData = students;
            studentPage = 1;
            renderStudentsPage();
        });
    }

    function renderStudentsPage() {
        var total = allStudentsData.length;
        var totalPages = Math.ceil(total / studentPageSize) || 1;
        if (studentPage > totalPages) studentPage = totalPages;
        var start = (studentPage - 1) * studentPageSize;
        var pageData = allStudentsData.slice(start, start + studentPageSize);
        var html = '';
        pageData.forEach(function(s) {
            html += '<tr><td>' + s.student_no + '</td><td>' + s.name + '</td><td>' + (s.gender || '-') + '</td><td>' + (s.student_no ? s.student_no.substring(6,8) : '-') + '</td><td>' + (s.phone || '-') + '</td></tr>';
        });
        $('#student-table').html(html || '<tr><td colspan="5" class="text-center text-muted">暂无数据</td></tr>');
        var end = Math.min(start + studentPageSize, total);
        $('#student-page-info').text(total ? '第 ' + (start + 1) + '-' + end + ' 条，共 ' + total + ' 条' : '');
        var phtml = '';
        phtml += '<li class="page-item ' + (studentPage <= 1 ? 'disabled' : '') + '"><a class="page-link" href="#" data-page="' + (studentPage - 1) + '">上一页</a></li>';
        var pages = []; var maxVisible = 5;
        var sp = Math.max(1, studentPage - Math.floor(maxVisible / 2));
        var ep = Math.min(totalPages, sp + maxVisible - 1);
        if (ep - sp < maxVisible - 1) sp = Math.max(1, ep - maxVisible + 1);
        if (sp > 1) { pages.push(1); if (sp > 2) pages.push('...'); }
        for (var i = sp; i <= ep; i++) pages.push(i);
        if (ep < totalPages) { if (ep < totalPages - 1) pages.push('...'); pages.push(totalPages); }
        pages.forEach(function(p) {
            if (p === '...') { phtml += '<li class="page-item disabled"><span class="page-link">...</span></li>'; }
            else { phtml += '<li class="page-item ' + (p === studentPage ? 'active' : '') + '"><a class="page-link" href="#" data-page="' + p + '">' + p + '</a></li>'; }
        });
        phtml += '<li class="page-item ' + (studentPage >= totalPages ? 'disabled' : '') + '"><a class="page-link" href="#" data-page="' + (studentPage + 1) + '">下一页</a></li>';
        $('#student-pagination').html(phtml);
    }

    $('#student-page-size').on('change', function() {
        studentPageSize = parseInt($(this).val());
        studentPage = 1;
        renderStudentsPage();
    });

    $(document).on('click', '#student-pagination .page-link', function(e) {
        e.preventDefault();
        var p = parseInt($(this).data('page'));
        var totalPages = Math.ceil(allStudentsData.length / studentPageSize) || 1;
        if (p >= 1 && p <= totalPages) { studentPage = p; renderStudentsPage(); }
    });

    $('#student-jump-page').on('input', function() {
        this.value = this.value.replace(/[^0-9]/g, '');
        var totalPages = Math.ceil(allStudentsData.length / studentPageSize) || 1;
        var v = parseInt(this.value);
        if (v > totalPages) this.value = totalPages;
    }).on('keypress', function(e) {
        if (e.which === 13) {
            var totalPages = Math.ceil(allStudentsData.length / studentPageSize) || 1;
            var p = parseInt($(this).val()) || 1;
            if (p >= 1 && p <= totalPages) { studentPage = p; renderStudentsPage(); }
            $(this).val('');
        }
    });
});
</script>
{% endblock %}
