{% extends "student/base.html" %}
{% block content %}
<div class="card card-table mb-4">
    <div class="card-header"><h6 class="mb-0">成绩筛选</h6></div>
    <div class="card-body">
        <div class="row">
            <div class="col-md-3"><select class="form-control form-control-sm" id="filter-course"><option value="">全部课程</option></select></div>
            <div class="col-md-3"><select class="form-control form-control-sm" id="filter-year"><option value="">全部年份</option></select></div>
            <div class="col-md-3"><select class="form-control form-control-sm" id="filter-term"><option value="">全部学期</option><option value="一">第一学期</option><option value="二">第二学期</option></select></div>
            <div class="col-md-3"><button class="btn btn-sm btn-primary" id="btn-filter"><i class="fas fa-search"></i> 查询</button></div>
        </div>
    </div>
</div>

<div class="card card-table">
    <div class="card-header"><h6 class="mb-0">我的成绩</h6></div>
    <div class="card-body p-0">
        <table class="table table-hover mb-0">
            <thead><tr><th>课程</th><th>学院</th><th>成绩</th><th>学期</th><th>时间</th></tr></thead>
            <tbody id="grade-table"></tbody>
        </table>
    </div>
</div>

<script>
$(function() {
    checkAuth('student');
    initFilters();
    loadGrades();

    $('#btn-filter').click(loadGrades);

    function initFilters() {
        var yearHtml = '<option value="">全部年份</option>';
        for (var y = 2020; y <= 2030; y++) { yearHtml += '<option value="' + y + '">' + y + '</option>'; }
        $('#filter-year').html(yearHtml);

        api.getCourses().then(function(courses) {
            var html = '<option value="">全部课程</option>';
            var currentCollege = '';
            courses.forEach(function(c) {
                if (c.college_code !== currentCollege) {
                    if (currentCollege) html += '</optgroup>';
                    currentCollege = c.college_code;
                    html += '<optgroup label="' + c.college_code + ' - ' + c.college_name + '">';
                }
                html += '<option value="' + c.id + '">' + c.name + '</option>';
            });
            if (currentCollege) html += '</optgroup>';
            $('#filter-course').html(html);
        });
    }

    function loadGrades() {
        var params = {};
        var cid = $('#filter-course').val(); if (cid) params.course_id = cid;
        var year = $('#filter-year').val(); if (year) params.semester_year = year;
        var term = $('#filter-term').val(); if (term) params.semester_term = term;

        api.getGrades(params).then(function(grades) {
            var html = '';
            grades.forEach(function(g) {
                var sem = (g.semester_year || '') + (g.semester_term ? ' 第' + g.semester_term + '学期' : '');
                html += '<tr><td>' + g.course_name + '</td><td>' + (g.college_name || '') + '</td><td><span class="badge badge-' + (g.score >= 90 ? 'success' : g.score >= 60 ? 'primary' : 'danger') + '">' + g.score + '</span></td><td>' + (sem || '-') + '</td><td>' + (g.created_at || '') + '</td></tr>';
            });
            $('#grade-table').html(html || '<tr><td colspan="5" class="text-center text-muted">暂无成绩</td></tr>');
        });
    }
});
</script>
{% endblock %}
