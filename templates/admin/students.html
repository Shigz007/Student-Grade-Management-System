{% extends "admin/base.html" %}
{% block content %}
<div class="card card-table">
    <div class="card-header d-flex justify-content-between align-items-center">
        <h6 class="mb-0">学生列表</h6>
        <div class="d-flex align-items-center">
            <input type="text" class="form-control form-control-sm mr-2" id="search-input" placeholder="搜索学号/姓名..." style="width: 200px;">
            <button class="btn btn-sm btn-primary" id="btn-add-student"><i class="fas fa-plus"></i> 新增学生</button>
        </div>
    </div>
    <div class="card-body p-0">
        <table class="table table-hover mb-0">
            <thead><tr><th>学号</th><th>姓名</th><th>性别</th><th>班级</th><th>电话</th><th>操作</th></tr></thead>
            <tbody id="student-table"></tbody>
        </table>
    </div>
</div>

<div class="modal fade" id="student-modal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header"><h5 class="modal-title" id="student-modal-title">新增学生</h5><button type="button" class="close" data-dismiss="modal">&times;</button></div>
            <div class="modal-body">
                <input type="hidden" id="edit-student-id">
                <div class="form-row">
                    <div class="form-group col-md-6"><label>入学年份</label>
                        <input type="text" class="form-control" id="form-enrollment-year" readonly>
                    </div>
                    <div class="form-group col-md-6"><label>学院</label>
                        <select class="form-control" id="form-college"><option value="">请选择</option></select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group col-md-6"><label>专业</label>
                        <select class="form-control" id="form-major"><option value="">请先选择学院</option></select>
                    </div>
                    <div class="form-group col-md-6"><label>班级序号 <small class="text-muted">（自动分配，01起满50人自动换班）</small></label>
                        <input type="text" class="form-control" id="form-class-seq" readonly>
                    </div>
                </div>
                <div class="form-group"><label>学号 <small class="text-muted">（自动生成）</small></label>
                    <input type="text" class="form-control" id="form-student-no" readonly required>
                </div>
                <div class="form-group"><label>姓名</label><input type="text" class="form-control" id="form-name" required></div>
                <div class="form-group"><label>性别</label><select class="form-control" id="form-gender"><option value="">请选择</option><option value="男">男</option><option value="女">女</option></select></div>
                <div class="form-group"><label>电话</label><input type="text" class="form-control" id="form-phone"></div>
                <hr>
                <div class="bg-light p-3 rounded" id="account-section">
                    <h6 class="text-muted mb-3"><i class="fas fa-user-lock mr-1"></i>系统账号</h6>
                    <div class="form-group mb-2"><label class="small mb-1">登录账号（同姓名，不可修改）</label><input type="text" class="form-control form-control-sm" id="form-account-name" readonly></div>
                    <div class="form-group mb-0"><label class="small mb-1">登录密码（不可修改）</label><input type="text" class="form-control form-control-sm" id="form-account-pwd" value="Ad112233" readonly></div>
                </div>
            </div>
            <div class="modal-footer"><button type="button" class="btn btn-secondary" data-dismiss="modal">取消</button><button type="button" class="btn btn-primary" id="btn-save-student">保存</button></div>
        </div>
    </div>
</div>

<script>
var MAJORS = {
    '01': [{code: '01', name: '计算机科学与技术'}, {code: '02', name: '软件工程'}],
    '02': [{code: '01', name: '数学与应用数学'}, {code: '02', name: '统计学'}],
    '03': [{code: '01', name: '电子信息工程'}, {code: '02', name: '通信工程'}],
    '04': [{code: '01', name: '经济学'}, {code: '02', name: '管理学'}],
    '05': [{code: '01', name: '英语'}, {code: '02', name: '日语'}]
};

$(function() {
    checkAuth('admin');
    initForm();
    loadStudents();

    $('#search-input').on('input', loadStudents);

    $('#form-name').on('input', function() {
        $('#form-account-name').val($(this).val());
    });

    $('#form-college').on('change', function() {
        var college = $(this).val();
        var $major = $('#form-major');
        $major.empty();
        if (!college) { $major.html('<option value="">请先选择学院</option>'); clearStudentNo(); return; }
        var list = MAJORS[college] || [];
        $major.append('<option value="">请选择专业</option>');
        list.forEach(function(m) { $major.append('<option value="' + m.code + '">' + m.name + '</option>'); });
        clearStudentNo();
    });

    $('#form-major').on('change', refreshStudentNo);

    $('#btn-add-student').click(function() {
        $('#edit-student-id').val('');
        $('#student-modal-title').text('新增学生');
        $('#form-name,#form-gender,#form-phone').val('');
        $('#form-college').val('');
        $('#form-enrollment-year').val(new Date().getFullYear());
        $('#form-major').html('<option value="">请先选择学院</option>');
        clearStudentNo();
        $('#form-account-name').val('');
        $('#account-section').show();
        $('#student-modal').modal('show');
    });

    $('#btn-save-student').click(function() {
        var id = $('#edit-student-id').val();
        var data = {
            student_no: $('#form-student-no').val().trim(),
            name: $('#form-name').val().trim(),
            gender: $('#form-gender').val(),
            enrollment_year: $('#form-enrollment-year').val(),
            college_code: $('#form-college').val(),
            major_code: $('#form-major').val(),
            class_name: '',
            phone: $('#form-phone').val().trim(),
            email: ''
        };
        if (!data.student_no || !data.name) { alert('学号和姓名不能为空'); return; }
        if (!data.enrollment_year || !data.college_code || !data.major_code) { alert('请选择入学年份、学院和专业'); return; }
        if (id) {
            api.updateStudent(id, data).then(function() { $('#student-modal').modal('hide'); loadStudents(); });
        } else {
            api.addStudent(data).then(function(res) { $('#student-modal').modal('hide'); loadStudents(); alert(res.message); });
        }
    });

    $(document).on('click', '.btn-edit', function() {
        var id = $(this).data('id');
        api.getStudents({}).then(function(students) {
            var s = students.find(function(st) { return st.id === id; });
            if (s) {
                $('#edit-student-id').val(s.id);
                $('#student-modal-title').text('编辑学生');
                $('#form-enrollment-year').val(s.enrollment_year || '');
                $('#form-college').val(s.college_code || '').trigger('change');
                setTimeout(function() {
                    $('#form-major').val(s.major_code || '');
                }, 200);
                $('#form-student-no').val(s.student_no);
                $('#form-class-seq').val(s.student_no.substring(6, 8));
                $('#form-name').val(s.name);
                $('#form-gender').val(s.gender);
                $('#form-phone').val(s.phone || '');
                $('#account-section').hide();
                $('#student-modal').modal('show');
            }
        });
    });

    $(document).on('click', '.btn-delete', function() {
        if (!confirm('确定删除该学生及其所有成绩？')) return;
        api.deleteStudent($(this).data('id')).then(function() { loadStudents(); });
    });

    function clearStudentNo() {
        $('#form-student-no').val('');
        $('#form-class-seq').val('');
    }

    function initForm() {
        $('#form-enrollment-year').val(new Date().getFullYear());

        api.getColleges().then(function(colleges) {
            var html = '<option value="">请选择学院</option>';
            colleges.forEach(function(c) { html += '<option value="' + c.code + '">' + c.code + ' - ' + c.name + '</option>'; });
            $('#form-college').html(html);
        });
    }

    function refreshStudentNo() {
        var year = $('#form-enrollment-year').val();
        var college = $('#form-college').val();
        var major = $('#form-major').val();
        if (!year || !college || !major) { clearStudentNo(); return; }
        // Always start from class 01, backend auto-rolls if full
        api.getNextStudentNo({ year: year, college: college, major: major, 'class': '01' }).then(function(res) {
            if (res.error) { alert(res.error); return; }
            $('#form-student-no').val(res.student_no);
            $('#form-class-seq').val(res.class_seq);
        });
    }

    function loadStudents() {
        var search = $('#search-input').val().trim();
        api.getStudents(search ? { search: search } : {}).then(function(students) {
            var html = '';
            students.forEach(function(s) {
                html += '<tr><td>' + s.student_no + '</td><td>' + s.name + '</td><td>' + (s.gender || '-') + '</td><td>' + (s.student_no ? s.student_no.substring(6,8) : '-') + '</td><td>' + (s.phone || '-') + '</td>';
                html += '<td><button class="btn btn-sm btn-info btn-action mr-1 btn-edit" data-id="' + s.id + '"><i class="fas fa-edit"></i></button><button class="btn btn-sm btn-danger btn-action btn-delete" data-id="' + s.id + '"><i class="fas fa-trash"></i></button></td></tr>';
            });
            $('#student-table').html(html || '<tr><td colspan="6" class="text-center text-muted">暂无数据</td></tr>');
        });
    }
});
</script>
{% endblock %}
