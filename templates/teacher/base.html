<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>学生成绩管理系统 - 教师</title>
    <link href="https://fonts.googleapis.com/css?family=Nunito:400,600,700,800|Roboto:400,500,700" rel="stylesheet">
    <link type="text/css" href="/assets/css/theme.css" rel="stylesheet">
    <link type="text/css" href="/assets/css/demo.css" rel="stylesheet">
    <script src="/assets/vendor/jquery/jquery.min.js"></script>
    <script src="/assets/vendor/popper/popper.min.js"></script>
    <script src="/assets/js/bootstrap/bootstrap.min.js"></script>
    <script src="/assets/js/theme.js"></script>
    <script src="/static/js/api.js"></script>
    <script src="/static/js/main.js"></script>
    <style>
        :root { --sidebar-width: 250px; --topbar-height: 64px; }
        .sidebar { position: fixed; top: 0; left: 0; bottom: 0; width: var(--sidebar-width); background: #1e1e2d; z-index: 1050; overflow-y: auto; transition: transform 0.3s ease; }
        .sidebar .sidebar-brand { padding: 20px 24px; }
        .sidebar .sidebar-brand a { color: #fff; font-size: 1.15rem; text-decoration: none; font-weight: 600; }
        .sidebar .nav-section { padding: 16px 24px 8px; color: #6c6d85; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1.5px; font-weight: 600; }
        .sidebar .navigation { list-style: none; padding: 0; margin: 0; }
        .sidebar .navigation-link { display: block; padding: 12px 24px; color: #a2a3b7; text-decoration: none; transition: all 0.15s; font-size: 0.9rem; }
        .sidebar .navigation-link:hover, .sidebar .navigation-link.active { color: #fff; background: rgba(255,255,255,0.06); }
        .sidebar .navigation-link i { width: 22px; margin-right: 10px; text-align: center; }

        .main-content { margin-left: var(--sidebar-width); min-height: 100vh; background: #f5f5f9; }
        .topbar { background: #fff; height: var(--topbar-height); padding: 0 24px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e8e8ef; }
        .page-body { padding: 24px; }

        .stat-card { border-radius: 10px; border: none; transition: transform 0.2s, box-shadow 0.2s; }
        .stat-card:hover { transform: translateY(-3px); }
        .stat-card .stat-value { font-size: 2rem; font-weight: 700; }
        .stat-card .stat-label { font-size: 0.85rem; opacity: 0.85; }

        .btn-action { padding: 4px 10px; font-size: 0.8rem; border-radius: 4px; }
        .table th { border-top: none; font-size: 0.78rem; text-transform: uppercase; color: #8898aa; font-weight: 600; letter-spacing: 0.5px; }

        .menu-toggle { display: none; background: none; border: none; font-size: 1.4rem; cursor: pointer; color: #525f7f; padding: 0 8px; }
        .sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1040; }
        body.sidebar-open .sidebar-overlay { display: block; }

        @media (max-width: 1199px) {
            .menu-toggle { display: inline-block; }
            .main-content { margin-left: 0; }
            .sidebar { transform: translateX(-100%); }
            .sidebar.toggled { transform: translateX(0); }
            body.sidebar-open { overflow: hidden; }
        }
    </style>
</head>
<body>
    <div class="sidebar-overlay" onclick="document.querySelector('.sidebar').classList.remove('toggled');document.body.classList.remove('sidebar-open')"></div>
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-brand">
            <a href="/teacher"><i class="fas fa-chalkboard-teacher mr-2"></i>成绩管理系统</a>
        </div>
        <div class="nav-section">教师面板</div>
        <ul class="navigation">
            <li><a class="navigation-link" href="/teacher" id="nav-dashboard"><i class="fas fa-tachometer-alt"></i> 仪表盘</a></li>
            <li><a class="navigation-link" href="/teacher/students" id="nav-students"><i class="fas fa-user-graduate"></i> 学生管理</a></li>
            <li><a class="navigation-link" href="/teacher/grades" id="nav-grades"><i class="fas fa-clipboard-list"></i> 成绩管理</a></li>
        </ul>
    </aside>

    <div class="main-content">
        <div class="topbar">
            <div class="d-flex align-items-center">
                <button class="menu-toggle mr-2" onclick="document.getElementById('sidebar').classList.toggle('toggled');document.body.classList.toggle('sidebar-open')">&#9776;</button>
                <h5 class="heading h5 mb-0" id="page-title">仪表盘</h5>
            </div>
            <div class="d-flex align-items-center">
                <span class="badge badge-primary mr-3">教师</span>
                <a href="#" id="user-display" class="mr-3 text-dark" style="cursor:pointer;text-decoration:none;" title="点击修改个人资料"></a>
                <button class="btn btn-sm btn-outline-danger" onclick="logout()"><i class="fas fa-sign-out-alt mr-1"></i>退出</button>
            </div>
        </div>
        <div class="page-body">
            {% block content %}{% endblock %}
        </div>
    </div>

    <div class="modal fade" id="profile-modal" tabindex="-1">
        <div class="modal-dialog modal-sm">
            <div class="modal-content">
                <div class="modal-header"><h5 class="modal-title"><i class="fas fa-user-cog mr-2"></i>个人资料</h5><button type="button" class="close" data-dismiss="modal">&times;</button></div>
                <div class="modal-body">
                    <div class="form-group"><label class="form-control-label small">用户名</label><input type="text" class="form-control form-control-sm" id="profile-username"></div>
                    <div class="form-group"><label class="form-control-label small">角色</label><input type="text" class="form-control form-control-sm" id="profile-role" readonly></div>
                    <hr>
                    <div class="form-group"><label class="form-control-label small">原密码</label><input type="password" class="form-control form-control-sm" id="profile-old-pw" placeholder="输入原密码"></div>
                    <div class="form-group"><label class="form-control-label small">新密码</label><input type="password" class="form-control form-control-sm" id="profile-new-pw" placeholder="至少6位"></div>
                    <div class="form-group"><label class="form-control-label small">确认新密码</label><input type="password" class="form-control form-control-sm" id="profile-confirm-pw" placeholder="再次输入新密码"></div>
                </div>
                <div class="modal-footer"><button type="button" class="btn btn-sm btn-secondary" data-dismiss="modal">取消</button><button type="button" class="btn btn-sm btn-primary" id="btn-save-profile">保存</button></div>
            </div>
        </div>
    </div>

    <script src="/assets/vendor/fontawesome/js/fontawesome-all.min.js" defer></script>
</body>
</html>
