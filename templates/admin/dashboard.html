{% extends "admin/base.html" %}
{% block content %}
<div class="row">
    <div class="col-xl-3 col-md-6 mb-4">
        <div class="card stat-card bg-primary text-white">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <div class="stat-value" id="stat-students">0</div>
                        <div class="stat-label">学生总数</div>
                    </div>
                    <div style="font-size:2rem;opacity:0.5;"><i class="fas fa-user-graduate"></i></div>
                </div>
            </div>
        </div>
    </div>
    <div class="col-xl-3 col-md-6 mb-4">
        <div class="card stat-card bg-success text-white">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <div class="stat-value" id="stat-avg">0</div>
                        <div class="stat-label">全校平均分</div>
                    </div>
                    <div style="font-size:2rem;opacity:0.5;"><i class="fas fa-chart-bar"></i></div>
                </div>
            </div>
        </div>
    </div>
    <div class="col-xl-3 col-md-6 mb-4">
        <div class="card stat-card bg-info text-white">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <div class="stat-value" id="stat-pass">0%</div>
                        <div class="stat-label">全校及格率</div>
                    </div>
                    <div style="font-size:2rem;opacity:0.5;"><i class="fas fa-check-circle"></i></div>
                </div>
            </div>
        </div>
    </div>
    <div class="col-xl-3 col-md-6 mb-4">
        <div class="card stat-card bg-warning text-white">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <div class="stat-value" id="stat-count">0</div>
                        <div class="stat-label">成绩记录数</div>
                    </div>
                    <div style="font-size:2rem;opacity:0.5;"><i class="fas fa-clipboard-list"></i></div>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="row">
    <div class="col-lg-6 mb-4">
        <div class="card card-table">
            <div class="card-header"><h6 class="mb-0">最近录入的成绩</h6></div>
            <div class="card-body p-0">
                <table class="table table-hover mb-0">
                    <thead><tr><th>学生</th><th>课程</th><th>成绩</th><th>学期</th></tr></thead>
                    <tbody id="recent-grades"></tbody>
                </table>
            </div>
        </div>
    </div>
    <div class="col-lg-6 mb-4">
        <div class="card card-table">
            <div class="card-header"><h6 class="mb-0">班级分布</h6></div>
            <div class="card-body">
                <div id="class-distribution"></div>
            </div>
        </div>
    </div>
</div>

<script>
$(function() {
    checkAuth('admin');

    var MAJORS = {
        '01': {'01':'计算机科学与技术','02':'软件工程'},
        '02': {'01':'数学与应用数学','02':'统计学'},
        '03': {'01':'电子信息工程','02':'通信工程'},
        '04': {'01':'经济学','02':'管理学'},
        '05': {'01':'英语','02':'日语'}
    };

    api.getStudents().then(function(students) {
        $('#stat-students').text(students.length);
        var classes = {};
        students.forEach(function(s) {
            var majorName = (MAJORS[s.college_code] && MAJORS[s.college_code][s.major_code]) || '';
            var cls = s.student_no ? s.student_no.substring(6,8) : '';
            var c = majorName + cls || '未分班';
            classes[c] = (classes[c] || 0) + 1;
        });
        var html = '';
        Object.keys(classes).forEach(function(c) {
            html += '<div class="d-flex justify-content-between align-items-center mb-2"><span>' + c + '</span><span class="badge badge-primary">' + classes[c] + ' 人</span></div>';
        });
        $('#class-distribution').html(html || '<p class="text-muted text-center">暂无数据</p>');
    });

    api.getStats().then(function(stats) {
        $('#stat-avg').text(stats.avg);
        $('#stat-pass').text(stats.pass_rate + '%');
        $('#stat-count').text(stats.count);
    });

    api.getGrades({}).then(function(grades) {
        var html = '';
        grades.slice(0, 8).forEach(function(g) {
            var sem = (g.semester_year || '') + (g.semester_term ? ' 第' + g.semester_term + '学期' : '');
            html += '<tr><td>' + g.student_name + '</td><td>' + g.course_name + '</td><td><span class="badge badge-' + (g.score >= 90 ? 'success' : g.score >= 60 ? 'primary' : 'danger') + '">' + g.score + '</span></td><td>' + (sem || '-') + '</td></tr>';
        });
        $('#recent-grades').html(html || '<tr><td colspan="4" class="text-center text-muted">暂无数据</td></tr>');
    });
});
</script>
{% endblock %}
