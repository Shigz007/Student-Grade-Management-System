{% extends "student/base.html" %}
{% block content %}
<div class="card z-depth-1 mb-4">
    <div class="card-header"><h6 class="heading h6 mb-0">成绩筛选</h6></div>
    <div class="card-body">
        <div class="d-flex align-items-center flex-wrap">
            <button class="btn btn-sm btn-outline-secondary mr-2 mb-2" type="button" data-toggle="collapse" data-target="#advanced-filters" id="btn-toggle-filters">
                <i class="fas fa-sliders-h"></i> 筛选 <i class="fas fa-caret-down"></i>
            </button>
            <div class="input-group input-group-transparent mr-2 mb-2" style="max-width: 300px;">
                <div class="input-group-prepend"><span class="input-group-text"><i class="fas fa-search"></i></span></div>
                <input type="text" class="form-control form-control-sm" id="search-input" placeholder="搜索课程、学院、学期...">
            </div>
        </div>
        <div class="collapse mt-3" id="advanced-filters">
            <div class="row">
                <div class="col-md-3 mb-2"><select class="form-control form-control-sm" id="filter-college"><option value="">全部学院</option></select></div>
                <div class="col-md-4 mb-2"><select class="form-control form-control-sm" id="filter-course"><option value="">全部课程</option></select></div>
                <div class="col-md-3 mb-2"><select class="form-control form-control-sm" id="filter-year"><option value="">全部年份</option></select></div>
                <div class="col-md-2 mb-2"><select class="form-control form-control-sm" id="filter-term"><option value="">全部学期</option><option value="一">第一学期</option><option value="二">第二学期</option></select></div>
            </div>
        </div>
    </div>
</div>

<div class="card z-depth-1">
    <div class="card-header"><h6 class="heading h6 mb-0">我的成绩</h6></div>
    <div class="card-body p-0">
        <table class="table table-hover mb-0">
            <thead><tr><th>课程</th><th>学院</th><th>成绩</th><th>学期</th><th>时间</th></tr></thead>
            <tbody id="grade-table"></tbody>
        </table>
    </div>
</div>

<script>
var collegeNames = {};

$(function() {
    checkAuth();
    initFilters();
    loadGrades();

    $('#search-input').on('input', loadGrades);
    $('#filter-year,#filter-term,#filter-course').on('change', loadGrades);
    $('#advanced-filters').on('show.bs.collapse', function() { $('#btn-toggle-filters i.fa-caret-down').removeClass('fa-caret-down').addClass('fa-caret-up'); });
    $('#advanced-filters').on('hide.bs.collapse', function() { $('#btn-toggle-filters i.fa-caret-up').removeClass('fa-caret-up').addClass('fa-caret-down'); });

    $('#filter-college').on('change', function() { populateFilterCourses($(this).val()); loadGrades(); });

    function populateFilterCourses(collegeCode) {
        var params = collegeCode ? { college_code: collegeCode } : {};
        api.getCourses(params).then(function(courses) {
            var html = '<option value="">全部课程</option>';
            courses.forEach(function(c) { html += '<option value="' + c.id + '">' + c.name + '</option>'; });
            $('#filter-course').html(html);
        });
    }

    function initFilters() {
        api.getColleges().then(function(colleges) {
            var html = '<option value="">全部学院</option>';
            colleges.forEach(function(c) { html += '<option value="' + c.code + '">' + c.name + '</option>'; collegeNames[c.code] = c.name; });
            $('#filter-college').html(html);
            populateFilterCourses();
        });
        api.getYears().then(function(years) {
            var html = '<option value="">全部年份</option>';
            years.forEach(function(y) { html += '<option value="' + y + '">' + y + '</option>'; });
            $('#filter-year').html(html);
        });
    }

    function loadGrades() {
        var params = {};
        var search = $('#search-input').val().trim(); if (search) params.search = search;
        var cid = $('#filter-course').val(); if (cid) params.course_id = cid;
        var year = $('#filter-year').val(); if (year) params.semester_year = year;
        var term = $('#filter-term').val(); if (term) params.semester_term = term;
        api.getGrades(params).then(function(grades) {
            var html = '';
            grades.forEach(function(g) {
                var sem = (g.semester_year || '') + (g.semester_term ? ' 第' + g.semester_term + '学期' : '');
                var badgeClass = g.score >= 90 ? 'success' : (g.score >= 60 ? 'primary' : 'danger');
                html += '<tr><td>' + g.course_name + '</td><td>' + (g.college_name || '') + '</td><td><span class="badge badge-' + badgeClass + '">' + g.score + '</span></td><td><small>' + (sem || '-') + '</small></td><td><small>' + (g.created_at || '') + '</small></td></tr>';
            });
            $('#grade-table').html(html || '<tr><td colspan="5" class="text-center text-muted">暂无成绩</td></tr>');
        });
    }
});
</script>
{% endblock %}
