{% extends "teacher/base.html" %}
{% block content %}
<div class="card z-depth-1 mb-4">
    <div class="card-header"><h6 class="heading h6 mb-0">成绩筛选</h6></div>
    <div class="card-body">
        <div class="d-flex justify-content-between align-items-center flex-wrap">
            <div class="d-flex justify-content-between align-items-center flex-grow-1 mr-3" style="min-width: 0;">
                <button class="btn btn-sm btn-outline-secondary mr-2 flex-shrink-0 mb-2" type="button" data-toggle="collapse" data-target="#advanced-filters" id="btn-toggle-filters">
                    <i class="fas fa-sliders-h mr-1"></i>筛选 <i class="fas fa-caret-down"></i>
                </button>
                <div class="input-group input-group-transparent flex-grow-1 mb-2" style="max-width: 360px;">
                    <div class="input-group-prepend"><span class="input-group-text"><i class="fas fa-search"></i></span></div>
                    <input type="text" class="form-control form-control-sm" id="search-input" placeholder="搜索学生、课程、学院、学期...">
                </div>
            </div>
            <button class="btn btn-sm btn-success mb-2" id="btn-add-grade"><i class="fas fa-plus mr-1"></i>录入成绩</button>
        </div>
        <div class="collapse mt-3" id="advanced-filters">
            <div class="row">
                <div class="col-md mb-2">
                    <label class="form-control-label small text-muted">学院</label>
                    <select class="form-control form-control-sm" id="filter-college"><option value="">全部学院</option></select>
                </div>
                <div class="col-md mb-2">
                    <label class="form-control-label small text-muted">专业</label>
                    <select class="form-control form-control-sm" id="filter-major"><option value="">全部专业</option></select>
                </div>
                <div class="col-md mb-2">
                    <label class="form-control-label small text-muted">课程</label>
                    <select class="form-control form-control-sm" id="filter-course"><option value="">全部课程</option></select>
                </div>
                <div class="col-md mb-2">
                    <label class="form-control-label small text-muted">年份</label>
                    <select class="form-control form-control-sm" id="filter-year"><option value="">全部年份</option></select>
                </div>
                <div class="col-md mb-2">
                    <label class="form-control-label small text-muted">学期</label>
                    <select class="form-control form-control-sm" id="filter-term"><option value="">全部学期</option><option value="一">第一学期</option><option value="二">第二学期</option></select>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="card z-depth-1">
    <div class="card-header d-flex justify-content-between align-items-center">
        <h6 class="heading h6 mb-0">成绩列表</h6>
        <div class="d-flex align-items-center">
            <small class="text-muted mr-2">每页</small>
            <select class="form-control form-control-sm" style="width:72px" id="grade-page-size">
                <option value="10">10</option>
                <option value="30">30</option>
                <option value="50">50</option>
            </select>
            <small class="text-muted ml-2">条</small>
        </div>
    </div>
    <div class="card-body p-0">
        <div class="table-responsive">
        <table class="table table-hover mb-0">
            <thead><tr><th>学号</th><th>学生</th><th>课程</th><th>学院</th><th>成绩</th><th>学期</th><th>时间</th><th>操作</th></tr></thead>
            <tbody id="grade-table"></tbody>
        </table>
        </div>
        <div class="d-flex justify-content-between align-items-center flex-wrap px-3 py-2 border-top">
            <small class="text-muted mb-1" id="grade-page-info"></small>
            <div class="d-flex align-items-center mx-2 mb-1">
                <small class="text-muted mr-1">跳至</small>
                <input type="text" class="form-control form-control-sm page-jump-input" id="grade-jump-page">
                <small class="text-muted ml-1">页</small>
            </div>
            <nav><ul class="pagination pagination-sm mb-0 flex-wrap" id="grade-pagination"></ul></nav>
        </div>
    </div>
</div>

<div class="modal fade" id="grade-modal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header"><h5 class="modal-title" id="grade-modal-title">录入成绩</h5><button type="button" class="close" data-dismiss="modal">&times;</button></div>
            <div class="modal-body">
                <input type="hidden" id="edit-grade-id">
                <div class="form-group"><label class="form-control-label">学生 <span class="text-danger">*</span> <small class="text-danger field-error" id="err-student"></small></label>
                    <div class="input-group input-group-transparent mb-2">
                        <div class="input-group-prepend"><span class="input-group-text"><i class="fas fa-search"></i></span></div>
                        <input type="text" class="form-control form-control-sm" id="form-student-search" placeholder="输入姓名或学号搜索学生...">
                    </div>
                    <select class="form-control" id="form-grade-student" size="6" required></select>
                </div>
                <div class="form-row">
                    <div class="form-group col-md-4"><label class="form-control-label">学院</label><input type="text" class="form-control" id="form-grade-college" readonly placeholder="自动填充"></div>
                    <div class="form-group col-md-4"><label class="form-control-label">专业</label><input type="text" class="form-control" id="form-grade-major" readonly placeholder="自动填充"></div>
                    <div class="form-group col-md-4"><label class="form-control-label">课程 <span class="text-danger">*</span> <small class="text-danger field-error" id="err-course"></small></label><select class="form-control" id="form-grade-course" disabled required><option value="">请选择课程</option></select></div>
                </div>
                <div class="form-group"><label class="form-control-label">成绩 (0-100) <span class="text-danger">*</span> <small class="text-danger field-error" id="err-score"></small></label><input type="number" class="form-control" id="form-score" min="0" max="100" step="0.5" required oninput="if(this.value>100)this.value=100;if(this.value<0)this.value=0"></div>
                <div class="form-row">
                    <div class="form-group col-md-6"><label class="form-control-label">学年 <span class="text-danger">*</span> <small class="text-danger field-error" id="err-year"></small></label><select class="form-control" id="form-year" required></select></div>
                    <div class="form-group col-md-6"><label class="form-control-label">学期 <span class="text-danger">*</span> <small class="text-danger field-error" id="err-term"></small></label><select class="form-control" id="form-term" required><option value="">请选择</option><option value="一">第一学期</option><option value="二">第二学期</option></select></div>
                </div>
            </div>
            <div class="modal-footer"><button type="button" class="btn btn-secondary" data-dismiss="modal">取消</button><button type="button" class="btn btn-primary" id="btn-save-grade">保存</button></div>
        </div>
    </div>
</div>

<script>
$(function() {
    checkAuth();
    initFilters();
    initCollegeEvents();
    loadStudentsDropdown();
    loadGrades();

    $('#search-input').on('input', loadGrades);
    $('#filter-year,#filter-term,#filter-course,#filter-major').on('change', loadGrades);
    $('#advanced-filters').on('show.bs.collapse', function() { $('#btn-toggle-filters i.fa-caret-down').removeClass('fa-caret-down').addClass('fa-caret-up'); });
    $('#advanced-filters').on('hide.bs.collapse', function() { $('#btn-toggle-filters i.fa-caret-up').removeClass('fa-caret-up').addClass('fa-caret-down'); });

    $('#btn-add-grade').click(function() {
        $('#edit-grade-id').val(''); $('#grade-modal-title').text('录入成绩');
        $('#form-score').val(''); $('#form-term').val('');
        confirmedStudentId = null; confirmedStudentText = '';
        $('#form-grade-college').val(''); $('#form-grade-major').val('');
        $('#form-grade-course').prop('disabled', true).html('<option value="">请选择课程</option>');
        $('#form-student-search').val('').trigger('input');
        $('#form-grade-student').val(''); $('#form-year').val('');
        $('.field-error').text('');
        $('#grade-modal').modal('show');
    });

    $('#btn-save-grade').click(function() {
        var id = $('#edit-grade-id').val();
        var data = {
            student_id: confirmedStudentId || parseInt($('#form-grade-student').val()),
            course_id: parseInt($('#form-grade-course').val()),
            score: parseFloat($('#form-score').val()),
            semester_year: $('#form-year').val(),
            semester_term: $('#form-term').val()
        };
        $('.field-error').text('');
        var ok = true;
        if (!data.student_id) { $('#err-student').text('请选择学生'); ok = false; }
        if (!data.course_id) { $('#err-course').text('请选择课程'); ok = false; }
        if (isNaN(data.score)) { $('#err-score').text('请输入成绩'); ok = false; }
        else if (data.score < 0 || data.score > 100) { $('#err-score').text('成绩0-100'); ok = false; }
        if (!data.semester_year) { $('#err-year').text('请选择学年'); ok = false; }
        if (!data.semester_term) { $('#err-term').text('请选择学期'); ok = false; }
        if (!ok) { showToast('还有必填项未填写', 'warning'); return; }
        if (id) { api.updateGrade(id, data).then(function(res) { $('#grade-modal').modal('hide'); loadGrades(); showToast(res.message, 'success'); }); }
        else { api.addGrade(data).then(function(res) { $('#grade-modal').modal('hide'); loadGrades(); showToast(res.message, 'success'); }); }
    });

    $(document).on('click', '.btn-edit-grade', function() {
        var id = $(this).data('id');
        api.getGrades({}).then(function(grades) {
            var g = grades.find(function(gr) { return gr.id === id; });
            if (g) {
                $('#edit-grade-id').val(g.id); $('#grade-modal-title').text('编辑成绩');
                $('#form-grade-student').val(g.student_id);
                $('#form-student-search').val(g.student_no + ' ' + g.student_name);
                $('#form-grade-college').val(collegeNames[g.college_code] || g.college_code || '');
                $('#form-score').val(g.score);
                $('#form-year').val(g.semester_year || ''); $('#form-term').val(g.semester_term || '');
                var editStudent = allStudents.find(function(s) { return s.id == g.student_id; });
                if (editStudent) {
                    var majorName = majorNames[editStudent.college_code + '_' + editStudent.major_code] || editStudent.major_code || '';
                    $('#form-grade-major').val(majorName);
                    populateFormYears(editStudent.enrollment_year);
                    populateFormCourses(editStudent.college_code, editStudent.major_code, g.course_id);
                } else {
                    populateFormCourses(g.college_code || '', '', g.course_id);
                }
                $('.field-error').text('');
                $('#grade-modal').modal('show');
            }
        });
    });

    $(document).on('click', '.btn-delete-grade', function() {
        if (!confirm('确定删除该成绩记录？')) return;
        api.deleteGrade($(this).data('id')).then(function() { loadGrades(); });
    });

    function populateFilterCourses(collegeCode, majorCode, savedValue) {
        var $course = $('#filter-course');
        var params = {};
        if (collegeCode) params.college_code = collegeCode;
        if (majorCode) params.major_code = majorCode;
        api.getCourses(params).then(function(courses) {
            var html = '<option value="">全部课程</option>';
            var exists = !savedValue;
            courses.forEach(function(c) {
                html += '<option value="' + c.id + '">' + c.name + '</option>';
                if (String(c.id) === String(savedValue)) exists = true;
            });
            $course.html(html);
            if (exists) $course.val(savedValue);
        });
    }

    function populateFormCourses(collegeCode, majorCode, selectedCourseId) {
        if (!collegeCode || !majorCode) { $('#form-grade-course').prop('disabled', true).html('<option value="">请选择课程</option>'); return; }
        api.getCourses({ college_code: collegeCode, major_code: majorCode }).then(function(courses) {
            var html = '<option value="">请选择课程</option>';
            courses.forEach(function(c) { html += '<option value="' + c.id + '">' + c.name + '</option>'; });
            $('#form-grade-course').html(html).prop('disabled', false);
            if (selectedCourseId) $('#form-grade-course').val(selectedCourseId);
        });
    }

    function populateFormYears(enrollmentYear) {
        var currentYear = new Date().getFullYear();
        var startYear = parseInt(enrollmentYear) || currentYear;
        var html = '<option value="">请选择</option>';
        for (var y = startYear; y <= currentYear; y++) { html += '<option value="' + y + '">' + y + '</option>'; }
        $('#form-year').html(html);
    }

    function initCollegeEvents() {
        $('#filter-college').on('change', function() {
            var collegeCode = $(this).val();
            var $major = $('#filter-major');
            var savedMajorText = $major.find('option:selected').text();
            var savedMajorVal = $major.val() || '';
            var savedCourse = $('#filter-course').val() || '';
            populateFilterMajors(collegeCode, savedMajorText, function() {
                var actualMajor = $('#filter-major').val() || '';
                var keepCourse = savedMajorVal && actualMajor ? savedCourse : '';
                populateFilterCourses(collegeCode, actualMajor, keepCourse);
                loadGrades();
            });
        });
        $('#filter-major').on('change', function() {
            var collegeCode = $('#filter-college').val();
            var majorCode = $(this).val();
            var savedCourse = $('#filter-course').val() || '';
            populateFilterCourses(collegeCode, majorCode, savedCourse);
            loadGrades();
        });
    }

    function populateFilterMajors(collegeCode, savedText, callback) {
        var $major = $('#filter-major');
        var params = collegeCode ? { college_code: collegeCode } : {};
        api.getMajors(params).then(function(majors) {
            var html = '<option value="">全部专业</option>';
            var matchCode = '';
            majors.forEach(function(m) {
                html += '<option value="' + m.code + '">' + m.name + '</option>';
                if (savedText && m.name === savedText) matchCode = m.code;
            });
            $major.html(html);
            $major.val(matchCode || '');
            if (callback) callback();
        });
    }

    function initFilters() {
        api.getColleges().then(function(colleges) {
            var filterHtml = '<option value="">全部学院</option>';
            colleges.forEach(function(c) { filterHtml += '<option value="' + c.code + '">' + c.name + '</option>'; collegeNames[c.code] = c.name; });
            $('#filter-college').html(filterHtml);
            populateFilterMajors('');
            populateFilterCourses();
        });
        api.getMajors({}).then(function(majors) {
            majors.forEach(function(m) { majorNames[m.college_code + '_' + m.code] = m.name; });
        });
        api.getYears().then(function(years) {
            var filterHtml = '<option value="">全部年份</option>';
            var formHtml = '<option value="">请选择</option>';
            years.forEach(function(y) { filterHtml += '<option value="' + y + '">' + y + '</option>'; formHtml += '<option value="' + y + '">' + y + '</option>'; });
            $('#filter-year').html(filterHtml); $('#form-year').html(formHtml);
        });
    }

    var allStudents = []; var collegeNames = {}; var majorNames = {}; var confirmedStudentId = null; var confirmedStudentText = '';
    var allGrades = []; var gradePage = 1; var gradePageSize = 10;

    function loadStudentsDropdown() {
        api.getStudents({}).then(function(students) {
            allStudents = students;
            var html = '<option value="" disabled>双击选择学生</option>';
            students.forEach(function(s) { html += '<option value="' + s.id + '">' + s.student_no + ' - ' + s.name + '</option>'; });
            $('#form-grade-student').html(html);
        });
    }

    $('#form-grade-student').on('dblclick', function() {
        var selected = $(this).find('option:selected');
        if (selected.val()) {
            $('#form-student-search').val(selected.text()).trigger('input');
            var student = allStudents.find(function(s) { return s.id == selected.val(); });
            if (student && student.college_code) {
                confirmedStudentId = student.id; confirmedStudentText = selected.text();
                $('#form-grade-college').val(collegeNames[student.college_code] || student.college_code);
                var majorName = majorNames[student.college_code + '_' + student.major_code] || student.major_code || '';
                $('#form-grade-major').val(majorName);
                if (student.major_code) { populateFormCourses(student.college_code, student.major_code); }
                populateFormYears(student.enrollment_year);
            }
        }
    });

    $('#form-student-search').on('input', function() {
        var q = $(this).val().trim();
        if (!q) {
            resetFormFields();
            var html = '<option value="" disabled>双击选择学生</option>';
            allStudents.forEach(function(s) { html += '<option value="' + s.id + '">' + s.student_no + ' - ' + s.name + '</option>'; });
            $('#form-grade-student').html(html);
            return;
        }
        if (confirmedStudentId && q !== confirmedStudentText) { resetCollegeOnly(); }
        var ql = q.toLowerCase();
        var filtered = allStudents.filter(function(s) {
            var target = (s.student_no + ' - ' + s.name).toLowerCase();
            var j = 0; for (var i = 0; i < target.length && j < ql.length; i++) { if (target[i] === ql[j]) j++; }
            return j === ql.length;
        });
        var html = '<option value="" disabled>双击选择学生</option>';
        filtered.forEach(function(s) { html += '<option value="' + s.id + '">' + s.student_no + ' - ' + s.name + '</option>'; });
        $('#form-grade-student').html(html);
    });

    function resetFormFields() {
        confirmedStudentId = null; confirmedStudentText = '';
        $('#form-grade-college').val(''); $('#form-grade-major').val('');
        $('#form-grade-course').prop('disabled', true).html('<option value="">请选择课程</option>');
        $('#form-year').val('');
    }

    function resetCollegeOnly() {
        confirmedStudentId = null; confirmedStudentText = '';
        $('#form-grade-college').val(''); $('#form-grade-major').val(''); $('#form-grade-student').val('');
        $('#form-grade-course').prop('disabled', true).html('<option value="">请选择课程</option>');
    }

    function loadGrades() {
        var params = {};
        var search = $('#search-input').val().trim(); if (search) params.search = search;
        var college = $('#filter-college').val(); if (college) params.college_code = college;
        var major = $('#filter-major').val(); if (major) params.major_code = major;
        var cid = $('#filter-course').val(); if (cid) params.course_id = cid;
        var year = $('#filter-year').val(); if (year) params.semester_year = year;
        var term = $('#filter-term').val(); if (term) params.semester_term = term;
        api.getGrades(params).then(function(grades) {
            allGrades = grades;
            gradePage = 1;
            renderGradesPage();
        });
    }

    function renderGradesPage() {
        var total = allGrades.length;
        var totalPages = Math.ceil(total / gradePageSize) || 1;
        if (gradePage > totalPages) gradePage = totalPages;
        var start = (gradePage - 1) * gradePageSize;
        var pageGrades = allGrades.slice(start, start + gradePageSize);
        var html = '';
        pageGrades.forEach(function(g) {
            var sem = (g.semester_year || '') + (g.semester_term ? ' 第' + g.semester_term + '学期' : '');
            var badgeClass = g.score >= 90 ? 'success' : (g.score >= 60 ? 'primary' : 'danger');
            html += '<tr><td>' + (g.student_no || '') + '</td><td>' + g.student_name + '</td><td>' + g.course_name + '</td><td>' + (g.college_name || '') + '</td>';
            html += '<td><span class="badge badge-' + badgeClass + '">' + g.score + '</span></td>';
            html += '<td><small>' + (sem || '-') + '</small></td><td><small>' + (g.created_at || '') + '</small></td>';
            html += '<td><button class="btn btn-sm btn-success btn-action mr-1 btn-edit-grade" data-id="' + g.id + '"><i class="fas fa-pencil-alt"></i></button><button class="btn btn-sm btn-danger btn-action btn-delete-grade" data-id="' + g.id + '"><i class="fas fa-trash-alt"></i></button></td></tr>';
        });
        $('#grade-table').html(html || '<tr><td colspan="8" class="text-center text-muted">暂无数据</td></tr>');
        var end = Math.min(start + gradePageSize, total);
        $('#grade-page-info').text(total ? '第 ' + (start + 1) + '-' + end + ' 条，共 ' + total + ' 条' : '');
        var phtml = '';
        phtml += '<li class="page-item ' + (gradePage <= 1 ? 'disabled' : '') + '"><a class="page-link" href="#" data-page="' + (gradePage - 1) + '">上一页</a></li>';
        var pages = []; var maxVisible = 5;
        var sp = Math.max(1, gradePage - Math.floor(maxVisible / 2));
        var ep = Math.min(totalPages, sp + maxVisible - 1);
        if (ep - sp < maxVisible - 1) sp = Math.max(1, ep - maxVisible + 1);
        if (sp > 1) { pages.push(1); if (sp > 2) pages.push('...'); }
        for (var i = sp; i <= ep; i++) pages.push(i);
        if (ep < totalPages) { if (ep < totalPages - 1) pages.push('...'); pages.push(totalPages); }
        pages.forEach(function(p) {
            if (p === '...') { phtml += '<li class="page-item disabled"><span class="page-link">...</span></li>'; }
            else { phtml += '<li class="page-item ' + (p === gradePage ? 'active' : '') + '"><a class="page-link" href="#" data-page="' + p + '">' + p + '</a></li>'; }
        });
        phtml += '<li class="page-item ' + (gradePage >= totalPages ? 'disabled' : '') + '"><a class="page-link" href="#" data-page="' + (gradePage + 1) + '">下一页</a></li>';
        $('#grade-pagination').html(phtml);
    }

    $('#grade-page-size').on('change', function() {
        gradePageSize = parseInt($(this).val());
        gradePage = 1;
        renderGradesPage();
    });

    $(document).on('click', '#grade-pagination .page-link', function(e) {
        e.preventDefault();
        var p = parseInt($(this).data('page'));
        var totalPages = Math.ceil(allGrades.length / gradePageSize) || 1;
        if (p >= 1 && p <= totalPages) { gradePage = p; renderGradesPage(); }
    });

    $('#grade-jump-page').on('input', function() {
        this.value = this.value.replace(/[^0-9]/g, '');
        var totalPages = Math.ceil(allGrades.length / gradePageSize) || 1;
        var v = parseInt(this.value);
        if (v > totalPages) this.value = totalPages;
    }).on('keypress', function(e) {
        if (e.which === 13) {
            var totalPages = Math.ceil(allGrades.length / gradePageSize) || 1;
            var p = parseInt($(this).val()) || 1;
            if (p >= 1 && p <= totalPages) { gradePage = p; renderGradesPage(); }
            $(this).val('');
        }
    });
});
</script>
{% endblock %}
