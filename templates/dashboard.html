{% extends "base.html" %}
{% block content %}
<div class="row" id="stat-cards"></div>

<div class="row">
    <div class="col-lg-6 mb-4" id="recent-panel">
        <div class="card card-table">
            <div class="card-header"><h6 class="mb-0" id="recent-title">最近录入的成绩</h6></div>
            <div class="card-body p-0">
                <table class="table table-hover mb-0">
                    <thead id="recent-thead"><tr><th>学生</th><th>课程</th><th>成绩</th><th>学期</th></tr></thead>
                    <tbody id="recent-grades"></tbody>
                </table>
            </div>
        </div>
    </div>
    <div class="col-lg-6 mb-4" id="class-dist-panel">
        <div class="card card-table">
            <div class="card-header"><h6 class="mb-0">班级分布</h6></div>
            <div class="card-body">
                <div id="class-distribution"></div>
            </div>
        </div>
    </div>
</div>

<script>
$(function() {
    checkAuth();

    var user = JSON.parse(localStorage.getItem('user') || '{}');
    var isStudent = user.role === 'student';

    if (isStudent) {
        $('#nav-students-item').hide();
        $('#class-dist-panel').hide();
        $('#recent-title').text('我的成绩');
        $('#recent-thead').html('<tr><th>课程</th><th>成绩</th><th>学期</th></tr>');

        // Student cards: 我的平均分 / 我的最高分 / 我的及格率 / 我的成绩数
        $('#stat-cards').html(
            '<div class="col-xl-3 col-md-6 mb-4"><div class="card stat-card bg-success text-white"><div class="card-body"><div class="d-flex justify-content-between align-items-center"><div><div class="stat-value" id="stat-avg">0</div><div class="text-sm">我的平均分</div></div><div class="stat-icon"><i class="fas fa-chart-bar"></i></div></div></div></div></div>' +
            '<div class="col-xl-3 col-md-6 mb-4"><div class="card stat-card bg-primary text-white"><div class="card-body"><div class="d-flex justify-content-between align-items-center"><div><div class="stat-value" id="stat-max">0</div><div class="text-sm">我的最高分</div></div><div class="stat-icon"><i class="fas fa-arrow-up"></i></div></div></div></div></div>' +
            '<div class="col-xl-3 col-md-6 mb-4"><div class="card stat-card bg-info text-white"><div class="card-body"><div class="d-flex justify-content-between align-items-center"><div><div class="stat-value" id="stat-pass">0%</div><div class="text-sm">我的及格率</div></div><div class="stat-icon"><i class="fas fa-check-circle"></i></div></div></div></div></div>' +
            '<div class="col-xl-3 col-md-6 mb-4"><div class="card stat-card bg-warning text-white"><div class="card-body"><div class="d-flex justify-content-between align-items-center"><div><div class="stat-value" id="stat-count">0</div><div class="text-sm">我的成绩数</div></div><div class="stat-icon"><i class="fas fa-clipboard-list"></i></div></div></div></div></div>'
        );

        api.getStats().then(function(stats) {
            $('#stat-avg').text(stats.avg);
            $('#stat-max').text(stats.max);
            $('#stat-pass').text(stats.pass_rate + '%');
            $('#stat-count').text(stats.count);
        });

        api.getGrades({}).then(function(grades) {
            var html = '';
            grades.forEach(function(g) {
                html += '<tr><td>' + g.course_name + '</td><td><span class="badge badge-' + (g.score >= 90 ? 'success' : g.score >= 60 ? 'primary' : 'danger') + '">' + g.score + '</span></td><td>' + (g.semester || '-') + '</td></tr>';
            });
            $('#recent-grades').html(html || '<tr><td colspan="3" class="text-center text-muted">暂无成绩</td></tr>');
        });

    } else {
        // Admin / Teacher cards: 学生总数 / 平均分 / 及格率 / 成绩记录数
        $('#stat-cards').html(
            '<div class="col-xl-3 col-md-6 mb-4"><div class="card stat-card bg-primary text-white"><div class="card-body"><div class="d-flex justify-content-between align-items-center"><div><div class="stat-value" id="stat-students">0</div><div class="text-sm">学生总数</div></div><div class="stat-icon"><i class="fas fa-user-graduate"></i></div></div></div></div></div>' +
            '<div class="col-xl-3 col-md-6 mb-4"><div class="card stat-card bg-success text-white"><div class="card-body"><div class="d-flex justify-content-between align-items-center"><div><div class="stat-value" id="stat-avg">0</div><div class="text-sm">全校平均分</div></div><div class="stat-icon"><i class="fas fa-chart-bar"></i></div></div></div></div></div>' +
            '<div class="col-xl-3 col-md-6 mb-4"><div class="card stat-card bg-info text-white"><div class="card-body"><div class="d-flex justify-content-between align-items-center"><div><div class="stat-value" id="stat-pass">0%</div><div class="text-sm">全校及格率</div></div><div class="stat-icon"><i class="fas fa-check-circle"></i></div></div></div></div></div>' +
            '<div class="col-xl-3 col-md-6 mb-4"><div class="card stat-card bg-warning text-white"><div class="card-body"><div class="d-flex justify-content-between align-items-center"><div><div class="stat-value" id="stat-count">0</div><div class="text-sm">成绩记录数</div></div><div class="stat-icon"><i class="fas fa-clipboard-list"></i></div></div></div></div></div>'
        );

        api.getStudents().then(function(students) {
            $('#stat-students').text(students.length);
        });

        api.getStats().then(function(stats) {
            $('#stat-avg').text(stats.avg);
            $('#stat-pass').text(stats.pass_rate + '%');
            $('#stat-count').text(stats.count);
        });

        api.getGrades({}).then(function(grades) {
            var recent = grades.slice(0, 8);
            var html = '';
            recent.forEach(function(g) {
                html += '<tr><td>' + g.student_name + '</td><td>' + g.course_name + '</td><td><span class="badge badge-' + (g.score >= 90 ? 'success' : g.score >= 60 ? 'primary' : 'danger') + '">' + g.score + '</span></td><td>' + (g.semester || '-') + '</td></tr>';
            });
            $('#recent-grades').html(html || '<tr><td colspan="4" class="text-center text-muted">暂无数据</td></tr>');
        });

        // Class distribution
        api.getStudents().then(function(students) {
            var classes = {};
            students.forEach(function(s) {
                var c = s.class_name || '未分班';
                classes[c] = (classes[c] || 0) + 1;
            });
            var html = '';
            Object.keys(classes).forEach(function(c) {
                html += '<div class="d-flex justify-content-between mb-2"><span>' + c + '</span><span class="badge badge-primary">' + classes[c] + '人</span></div>';
            });
            $('#class-distribution').html(html || '<p class="text-muted text-center">暂无数据</p>');
        });
    }
});
</script>
{% endblock %}
