{% extends "teacher/base.html" %}
{% block content %}
<style>
    #schedule-table td:last-child,
    #schedule-table th:last-child {
        position: static !important; right: auto !important;
        box-shadow: none !important; z-index: auto !important;
        padding-right: 0.75rem !important;
    }
</style>
<div class="card z-depth-1 mb-4">
    <div class="card-header"><h6 class="heading h6 mb-0">课表查看</h6></div>
    <div class="card-body">
        <div class="d-flex align-items-center flex-wrap">
            <div class="mr-2 mb-2"><label class="form-control-label small text-muted">选择班级</label><select class="form-control form-control-sm" id="filter-class"><option value="">选择班级</option></select></div>
        </div>
    </div>
</div>

<div class="card z-depth-1" id="schedule-card" style="display:none;">
    <div class="card-header d-flex justify-content-between align-items-center">
        <h6 class="heading h6 mb-0" id="schedule-title">课程表</h6>
    </div>
    <div class="card-body p-0">
        <div class="table-responsive">
        <table class="table table-bordered mb-0" id="schedule-table">
            <thead>
                <tr>
                    <th class="text-center bg-light" style="width:120px;">时间</th>
                    <th class="text-center bg-light">周一</th>
                    <th class="text-center bg-light">周二</th>
                    <th class="text-center bg-light">周三</th>
                    <th class="text-center bg-light">周四</th>
                    <th class="text-center bg-light">周五</th>
                </tr>
            </thead>
            <tbody id="schedule-grid"></tbody>
        </table>
        </div>
    </div>
</div>

<script>
$(function() {
    checkAuth();

    var TIME_SLOTS = ['08:30-10:05', '10:25-12:00', '13:30-15:05', '15:25-17:00', '17:10-18:45', '19:00-20:25'];

    // Load teacher's assigned classes
    api.getMyClasses().then(function(classes) {
        var html = '<option value="">选择班级</option>';
        classes.forEach(function(c) {
            html += '<option value="' + c.college_code + '|' + c.major_code + '|' + c.class_name + '">' + c.college_name + ' - ' + c.major_name + ' - ' + c.class_name + '班</option>';
        });
        $('#filter-class').html(html);
    });

    $('#filter-class').on('change', function() {
        var val = $(this).val();
        if (!val) return;
        var parts = val.split('|');
        var college = parts[0], major = parts[1], cls = parts[2];
        var text = $('#filter-class option:selected').text();
        $('#schedule-title').text(text + ' 课程表');

        api.getSchedules({college_code: college, major_code: major, class_name: cls}).then(function(entries) {
            var data = {};
            for (var d = 1; d <= 5; d++) data[d] = {};
            entries.forEach(function(e) { data[e.day_of_week][e.time_slot] = e; });
            var html = '';
            for (var s = 0; s < 6; s++) {
                html += '<tr><td class="text-center bg-light align-middle text-sm">' + TIME_SLOTS[s] + '</td>';
                for (var d = 1; d <= 5; d++) {
                    var entry = data[d][s + 1];
                    if (entry) {
                        html += '<td class="text-center p-1"><span class="btn btn-sm btn-primary btn-block" style="cursor:default;">' + entry.course_name + '</span></td>';
                    } else {
                        html += '<td class="text-center p-1"><span class="btn btn-sm btn-outline-light btn-block text-muted" style="cursor:default;">-</span></td>';
                    }
                }
                html += '</tr>';
            }
            $('#schedule-grid').html(html);
            $('#schedule-card').show();
        }).fail(function() { showToast('加载失败', 'danger'); });
    });
});
</script>
{% endblock %}
