<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>登录 - 学生综合管理系统</title>
    <link href="https://fonts.googleapis.com/css?family=Nunito:400,600,700,800|Roboto:400,500,700" rel="stylesheet">
    <link type="text/css" href="/assets/css/theme.css" rel="stylesheet">
    <link type="text/css" href="/assets/css/demo.css" rel="stylesheet">
</head>
<body>
    <main class="main">
        <section class="spotlight parallax bg-cover bg-size--cover" data-spotlight="fullscreen" style="background-image: url('/assets/images/backgrounds/img-1.jpg')">
            <span class="mask bg-primary alpha-7"></span>
            <div class="spotlight-holder py-lg pt-lg-xl">
                <div class="container d-flex align-items-center no-padding">
                    <div class="col">
                        <div class="row justify-content-center">
                            <div class="col-lg-4 col-md-6">
                                <div class="card bg-white z-depth-3">
                                    <div class="card-body p-5">
                                        <div class="text-center mb-4">
                                            <i class="fas fa-school fa-3x text-primary mb-3"></i>
                                            <h4 class="heading h3 mb-2">学生综合管理系统</h4>
                                            <p class="text-muted mb-0">请登录您的账号</p>
                                        </div>
                                        <div class="alert alert-danger" id="login-error" style="display:none;"></div>
                                        <form id="login-form">
                                            <div class="form-group">
                                                <label class="form-control-label">用户名</label>
                                                <div class="input-group input-group-transparent">
                                                    <div class="input-group-prepend">
                                                        <span class="input-group-text"><i class="fas fa-user"></i></span>
                                                    </div>
                                                    <input type="text" class="form-control" id="username" placeholder="请输入用户名" required>
                                                </div>
                                            </div>
                                            <div class="form-group">
                                                <label class="form-control-label">密码</label>
                                                <div class="input-group input-group-transparent">
                                                    <div class="input-group-prepend">
                                                        <span class="input-group-text"><i class="fas fa-lock"></i></span>
                                                    </div>
                                                    <input type="password" class="form-control" id="password" placeholder="请输入密码" required>
                                                </div>
                                            </div>
                                            <button type="submit" class="btn btn-primary btn-block btn-lg mt-4">登 录</button>
                                        </form>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="/assets/vendor/jquery/jquery.min.js"></script>
    <script src="/assets/vendor/popper/popper.min.js"></script>
    <script src="/assets/js/bootstrap/bootstrap.min.js"></script>
    <script src="/assets/vendor/fontawesome/js/fontawesome-all.min.js" defer></script>
    <script src="/assets/js/theme.js"></script>
    <script src="/static/js/api.js"></script>
    <script>
        $(function() {
            var user = JSON.parse(localStorage.getItem('user') || '{}');
            if (localStorage.getItem('token') && user.role) {
                window.location.href = '/' + user.role;
            }
            $('#login-form').on('submit', function(e) {
                e.preventDefault();
                var username = $('#username').val().trim();
                var password = $('#password').val();
                $.ajax({
                    url: '/api/login',
                    method: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify({ username: username, password: password }),
                    success: function(res) {
                        localStorage.setItem('token', res.token);
                        localStorage.setItem('user', JSON.stringify(res.user));
                        window.location.href = '/' + res.user.role;
                    },
                    error: function(xhr) {
                        var msg = xhr.responseJSON ? xhr.responseJSON.error : '登录失败';
                        $('#login-error').text(msg).show();
                    }
                });
            });
        });
    </script>
</body>
</html>
